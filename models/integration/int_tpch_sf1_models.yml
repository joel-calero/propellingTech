version: 2

models:
  - name: int_orders_customers
    description: >
      Joins order data with customer, nation, and region information.
      Provides a  view of each order with associated customer location
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: total_price
        description: Total price of the order before discounts

      - name: order_status
        description: Order status ('O' for Open, 'F' for Filled, 'P' for Pending)

  - name: int_lineitem_part_supplier
    description: >
      Joins line item records with part, supplier, and partsupp
      data. Enriches each transaction line with full product, supplier, and cost details
    columns:
      - name: order_id
        description: Foreign key referencing the order this line item belongs to
        tests:
          - not_null
      
      - name: extended_price
        description: Extended price before discount

      - name: discount
        description: Discount percentage applied

      - name: line_total
        description: Net revenue for the line item after applying the discount

      - name: supply_cost
        description: Cost to supply the item

      - name: margin
        description: Profit margin

  - name: int_orders_lineitems
    description: >
      View of transactional sales with full customer, product,
      supplier, and margin
    columns:
      - name: order_id
        description: Unique identifier for the order
        tests:
          - not_null
      
      - name: line_total
        description: Revenue for this line item after discount

      - name: margin

  - name: int_part_suppliers
    description: >
      Joins part, supplier, and partsupp data to provide
      a detailed view of product sourcing, including supply cost, availability,
      and supplier location
    columns:
      - name: part_id
        description: Unique identifier for the part
        tests:
          - not_null

      - name: supplier_id
        description: Unique identifier for the supplier
        tests:
          - not_null

      - name: supplier_cost
        description: Cost to supply the part from the supplier

  - name: int_customer_value
    description: >
      Calculates customer-level value.
      Aggregates revenue and order activity per customer
    columns:
      - name: customer_id
        description: Unique identifier for each customer
        tests:
          - not_null
          - unique

      - name: first_order_date
        description: First recorded order

      - name: last_order_date
        description: Last order

      - name: total_orders
        description: Total number of orders

      - name: total_revenue
        description: Total revenue generated by the customer across all orders

      - name: avg_order_value
        description: Average value of each order
